<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exam | Randall</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <div class="logo">
        Randall.
    </div>

    <nav>

        <a href="index.html">
            HOME
        </a>

        <a href="quiz.html">
            QUIZ
        </a>

        <a href="laboratory.html">
            LABORATORY
        </a>

        <a href="exam.html">
            EXAM
        </a>

    </nav>

</header>


<main class="page">

    <h1 class="page-title">
        My Exam
    </h1>


    <div class="cards">


        <!-- PRELIM -->

        <div class="card">

            <h2>
                Prelim Exam
            </h2>

            <p>
                My Prelim examination
            </p>

            <a
                href="#"
                class="button"
                onclick="openPrelim()">

                View Prelim Exam

            </a>

        </div>


        <!-- MIDTERM -->

        <div class="card">

            <h2>
                Midterm Exam
            </h2>

            <p>
                My Midterm examination
            </p>

            <a
                href="#"
                class="button"
                onclick="openMidterm()">

                View Midterm Exam

            </a>

        </div>


        <!-- EXAM SCORE -->

        <div class="card">

            <h2>
                Exam Score
            </h2>

            <p>
                My examination score
            </p>

            <a
                href="#"
                class="button"
                onclick="showExamScore()">

                View Score

            </a>

        </div>


    </div>

</main>


<script>

function openPrelim() {

    alert("Prelim Exam opened!");

}


function openMidterm() {

    alert("Midterm Exam opened!");

}


function showExamScore() {

    alert("Exam Score: 92 / 100");

}

</script>


</body>
</html>
