<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz | Randall</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <div class="logo">
        Randall.
    </div>

    <nav>

        <a href="index.html">
            HOME
        </a>

        <a href="quiz.html">
            QUIZ
        </a>

        <a href="laboratory.html">
            LABORATORY
        </a>

        <a href="exam.html">
            EXAM
        </a>

    </nav>

</header>


<main class="page">

    <h1 class="page-title">
        My Quiz
    </h1>


    <div class="cards">


        <!-- QUIZ 1 -->

        <div class="card">

            <h2>
                Quiz 1
            </h2>

            <p>
                My first quiz
            </p>

            <a
                href="#"
                class="button"
                onclick="startQuiz1()">

                View Quiz 1

            </a>

        </div>


        <!-- QUIZ 2 -->

        <div class="card">

            <h2>
                Quiz 2
            </h2>

            <p>
                My second quiz
            </p>

            <a
                href="#"
                class="button"
                onclick="startQuiz2()">

                View Quiz 2

            </a>

        </div>


        <!-- QUIZ SCORE -->

        <div class="card">

            <h2>
                Quiz Score
            </h2>

            <p>
                My quiz score
            </p>

            <a
                href="#"
                class="button"
                onclick="showQuizScore()">

                View Score

            </a>

        </div>


    </div>

</main>


<script>

function startQuiz1() {

    alert("Quiz 1 opened!");

}


function startQuiz2() {

    alert("Quiz 2 opened!");

}


function showQuizScore() {

    alert("Quiz Score: 95 / 100");

}

</script>


</body>
</html>
